<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <radialGradient id="halo">
      <stop offset="0.25" stop-color="#ffe3ad" stop-opacity="0.55"/>
      <stop offset="0.52" stop-color="#ffd897" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffd897" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="0.4" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#fffbf0"/>
      <stop offset="0.55" stop-color="#fbedcd"/>
      <stop offset="1" stop-color="#efd39d"/>
    </radialGradient>
    <!-- A painted edge rather than a perfect circle -->
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Its seas, as soft blooms of warm grey -->
    <filter id="seas" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="21"/>
      <feColorMatrix values="0 0 0 0 0.66  0 0 0 0 0.55  0 0 0 0 0.42  3 0 0 0 -1.45"/>
    </filter>
    <clipPath id="disc-clip"><circle cx="120" cy="120" r="64"/></clipPath>
  </defs>
  <circle cx="120" cy="120" r="120" fill="url(#halo)"/>
  <g filter="url(#edge)">
    <circle cx="120" cy="120" r="64" fill="url(#disc)"/>
    <rect width="240" height="240" filter="url(#seas)" clip-path="url(#disc-clip)" opacity="0.5"/>
  </g>
</svg>
