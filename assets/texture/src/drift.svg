<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Wet-in-wet: pigment drifting and pooling as the wash dried. Blended with
       multiply, so it deepens whatever colour is beneath. -->
  <filter id="drift" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0018 0.0028" numOctaves="4" seed="4"/>
    <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.31  0 0 0 0 0.48  2.8 0 0 0 -1.2"/>
  </filter>
  <rect width="1600" height="1000" filter="url(#drift)"/>
</svg>
