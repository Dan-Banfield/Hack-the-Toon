<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <radialGradient id="halo">
      <stop offset="0.25" stop-color="#fff6d6" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffe9a8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="0.6" stop-color="#fff1b8"/>
      <stop offset="1" stop-color="#ffd76a"/>
    </radialGradient>
    <!-- A painted edge rather than a perfect circle -->
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <circle cx="120" cy="120" r="120" fill="url(#halo)"/>
  <circle cx="120" cy="120" r="64" fill="url(#disc)" filter="url(#edge)"/>
</svg>
