<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hack the Toon · Thank you</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4ecdf">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon-48.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400&family=DotGothic16&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <script src="js/thanks.js" defer></script>
</head>
<body>
  <div class="page page--thanks">

    <header class="site-header">
      <a class="brand" href="./index.html">
        <!--svg class="brand__mark" viewBox="0 0 48 32" aria-hidden="true">
          <path d="M4 28 Q24 -6 44 28" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M2 20 H46" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path d="M14 12.5V20 M19 9V20 M24 7.8V20 M29 9V20 M34 12.5V20" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="24" cy="27" r="2.6" fill="var(--metro)"/>
        </svg>
        <span class="brand__name">Hack the Toon</span!-->
      </a>
    </header>

    <main class="thanks">
      <div class="arrival" aria-hidden="true">
        <p class="dotmatrix arrival__display">
          <!--span class="dotmatrix__dot"></span!-->
          <span data-display>Now arriving: Hack the Toon</span>
        </p>

        <div class="arrival__track">
          <img class="arrival__train" src="assets/img/metrocar.webp" width="1800" height="300" alt="">
          <!-- Two pencil rails, a little wobbly, as if sketched by hand -->
          <svg class="arrival__rails" viewBox="0 0 3000 14" preserveAspectRatio="none">
            <path d="M0 4 C500 3 1000 5.5 1500 4 S2500 3 3000 4.5" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
            <path d="M0 10.5 C600 11.5 1100 9.5 1500 10.5 S2400 11.5 3000 10" stroke-width="1.2" vector-effect="non-scaling-stroke" opacity=".6"/>
          </svg>
        </div>
      </div>

      <div class="note">
        <div class="note__card thanks__copy">
          <p class="thanks__kicker" data-greeting>Whey aye!</p>
          <h1 class="thanks__title">Thank you for your interest.</h1>
          <p class="thanks__lede">
            We&rsquo;ll be in touch closer to the time. Until then,
            <span class="geordie" tabindex="0">gan canny<span class="geordie__gloss" role="tooltip">take care</span></span>.
          </p>
          <img class="note__seal" src="assets/img/letter-stamp.webp" width="520" height="522" alt="" aria-hidden="true">
        </div>
      </div>
    </main>

    <!-- The university arches are painted as a corner piece (straight left and
         bottom edges); the Angel stands on its own hill -->
    <img class="corner corner--left" src="assets/img/campus-arches.webp" width="866" height="1100" alt="" aria-hidden="true">
    <img class="corner corner--angel" src="assets/img/angel-of-the-north.webp" width="800" height="597" alt="" aria-hidden="true">
  </div>
</body>
</html>
